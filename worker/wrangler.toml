name = "inaayah-api"
account_id = "107b188591986cb056d372e944a133d0"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["cache_option_enabled"]
workers_dev = true
preview_urls = true

routes = [
  { pattern = "api.inaayah.dev", zone_name = "inaayah.dev", custom_domain = true },
  { pattern = "releases.inaayah.dev", zone_name = "inaayah.dev", custom_domain = true }
]

# Free tier usage: 100,000 requests/day
# Set your fine-grained GitHub token in Cloudflare secrets:
#   npx wrangler secret put GITHUB_TOKEN

[vars]
# Enable only after the session-aware launcher is published on all desktop platforms.
LAUNCHER_AUTH_GAMES = "vigilante-red-city"
GITHUB_ORG = "inaayah"
CACHE_TTL_SECONDS = 604800
CACHE_REVISION = "launcher-v0.2.13"
EMAIL_FROM = "Inaayah Studio <noreply@inaayah.dev>"
EMAIL_REPLY_TO = "sazid@inaayah.dev"
ADMIN_EMAILS = "sazid@inaayah.dev,admin@inaayah.dev"

# Cloudflare D1 Database (Free Tier: 5 GB storage, 5M reads/day, 100k writes/day)
# Provision with:
#   cd worker && npx wrangler d1 create inaayah-launcher-db
# Then paste the generated database_id below and apply schema.sql:
#   npx wrangler d1 execute inaayah-launcher-db --remote --file=./schema.sql

[[d1_databases]]
binding = "DB"
database_name = "inaayah-launcher-db"
database_id = "f979366a-81f8-4eec-913e-99f817e4f405"
