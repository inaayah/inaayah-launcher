<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inaayah Game Launcher</title>
    <link rel="icon" type="image/png" href="https://cdn.inaayah.dev/brand/inaayah-games-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.inaayah.dev/brand/inaayah-games-icon.png" />
    <link rel="preconnect" href="https://cdn.inaayah.dev" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('inaayah_theme');
          var sysLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = saved === 'light' || saved === 'dark' || saved === 'midnight' ? saved : (sysLight ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="margin:0;padding:0;background:var(--bg-base, #171817);color:var(--text-primary, #F3F0E8);font-family:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;user-select:none;">
    <div id="root">
      <div style="height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(204,139,69,0.08),transparent 55%),var(--bg-base, #171817);gap:18px;">
        <div style="width:68px;height:68px;border-radius:18px;background:rgba(204,139,69,0.12);border:1px solid rgba(204,139,69,0.32);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 42px -12px rgba(0,0,0,0.6);">
          <img src="https://cdn.inaayah.dev/brand/inaayah-games-icon.png" onerror="this.onerror=null;this.src='./brand/inaayah-games-icon.png';" alt="Inaayah Games" style="width:48px;height:48px;border-radius:12px;" />
        </div>
        <div style="text-align:center;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.22em;color:#CC8B45;text-transform:uppercase;margin-bottom:6px;">INAAYAH GAMES</div>
          <div style="font-size:18px;font-weight:700;color:var(--text-primary, #F3F0E8);">Initializing Launcher...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
