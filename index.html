<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inaayah Game Launcher</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body style="margin:0;padding:0;background:#07090e;color:#f1f5f9;font-family:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;user-select:none;">
    <div id="root">
      <div style="height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(0,240,255,0.12),transparent 55%),#07090e;gap:18px;">
        <div style="width:68px;height:68px;border-radius:18px;background:rgba(0,240,255,0.08);border:1px solid rgba(0,240,255,0.32);display:flex;align-items:center;justify-content:center;box-shadow:0 0 28px rgba(0,240,255,0.22);">
          <img src="./icon.png" alt="Inaayah Studio" style="width:48px;height:48px;border-radius:12px;" />
        </div>
        <div style="text-align:center;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.22em;color:#00f0ff;text-transform:uppercase;margin-bottom:6px;">INAAYAH STUDIO</div>
          <div style="font-size:18px;font-weight:700;color:#f1f5f9;">Initializing Launcher...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
