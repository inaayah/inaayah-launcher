<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="Inaayah Arcade">
  <title>Inaayah Arcade</title>
  <defs>
    <linearGradient id="arcadeBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171F30"/>
      <stop offset="100%" stop-color="#0C0F17"/>
    </linearGradient>
    <linearGradient id="arcadeBrass" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5B869"/>
